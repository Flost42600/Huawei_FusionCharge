# Recharge forcée du soir selon le SOC de la Volvo.
#
# À adapter : remplacez les entités sensor.volvo_* et binary_sensor.volvo_*
# par celles de votre intégration Volvo, et "borne_garage" par le nom de votre borne.
#
# Prérequis : commandes activées dans les options de Huawei FusionCharge,
# et le test "Démarrer la charge hors plage" du README validé sur votre installation.
#
# Entrées réglables depuis Home Assistant (à créer dans Paramètres > Entrées) :
#   input_datetime.recharge_soir_heure      (heure seule, ex. 22:00)
#   input_number.recharge_soir_seuil        (0-100 %, ex. 50)
#   input_number.recharge_soir_cible        (0-100 %, ex. 80)
#   input_boolean.recharge_soir_en_cours    (mémorise qu'une charge forcée est en cours)

automation:
  - id: recharge_soir_demarrage
    alias: "Recharge du soir : démarrer si SOC bas"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.recharge_soir_heure
    conditions:
      # Véhicule branché
      - condition: state
        entity_id: binary_sensor.volvo_charging_cable_connected
        state: "on"
      # SOC disponible : "unavailable" ou "unknown" n'est jamais lu comme 0 %
      - condition: template
        value_template: >
          {{ has_value('sensor.volvo_battery') }}
      # SOC récent (moins de 60 minutes)
      - condition: template
        value_template: >
          {{ (now() - states.sensor.volvo_battery.last_reported) < timedelta(minutes=60) }}
      # SOC sous le seuil
      - condition: template
        value_template: >
          {{ states('sensor.volvo_battery') | float(101) < states('input_number.recharge_soir_seuil') | float(0) }}
      # Pas de charge déjà en cours
      - condition: numeric_state
        entity_id: sensor.borne_garage_puissance_de_charge
        below: 0.5
    actions:
      - action: button.press
        target:
          entity_id: button.borne_garage_demarrer_la_charge
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.recharge_soir_en_cours
      - delay: "00:02:00"
      - if:
          - condition: numeric_state
            entity_id: sensor.borne_garage_puissance_de_charge
            below: 0.5
        then:
          - action: persistent_notification.create
            data:
              title: "Recharge du soir"
              message: "La borne n'a pas démarré la charge deux minutes après la commande."

  - id: recharge_soir_arret
    alias: "Recharge du soir : arrêter à la cible et réarmer la programmation"
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{ has_value('sensor.volvo_battery')
             and states('sensor.volvo_battery') | float(0) >= states('input_number.recharge_soir_cible') | float(100) }}
      # Débranchement pendant la charge forcée
      - trigger: state
        entity_id: binary_sensor.volvo_charging_cable_connected
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.recharge_soir_en_cours
        state: "on"
    actions:
      - action: button.press
        target:
          entity_id: button.borne_garage_arreter_la_charge
        continue_on_error: true
      - delay: "00:00:30"
      # Rend la main aux plages solaires FusionSolar (à confirmer par le test 3 du README)
      - action: button.press
        target:
          entity_id: button.borne_garage_armer_la_programmation
        continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.recharge_soir_en_cours

  # Après un redémarrage de Home Assistant pendant une charge forcée, l'état est
  # conservé dans input_boolean.recharge_soir_en_cours : l'automatisation d'arrêt
  # reprend la surveillance du SOC sans action particulière.
